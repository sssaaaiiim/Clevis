services:
  pinchtab:
    image: pinchtab/pinchtab:v0.15.2
    env_file:
      - ./backend/.env
    environment:
      PINCHTAB_CONFIG: /config/pinchtab.json
      OPENROUTER_API_KEY: null
    volumes:
      - ./backend/pinchtab.config.json:/config/pinchtab.json:ro
      - pinchtab-data:/data
    shm_size: 2gb
    networks:
      - browser-control

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PINCHTAB_URL: http://pinchtab:9867
    ports:
      - "8000:8000"
    depends_on:
      - pinchtab
    networks:
      - browser-control

networks:
  browser-control:
    driver: bridge

volumes:
  pinchtab-data:
