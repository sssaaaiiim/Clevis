<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clevis local smoke test</title>
  </head>
  <body>
    <header>
      <h1>Clevis local smoke test</h1>
      <nav aria-label="Test pages">
        <a href="/test-page.html">Main</a>
        <a href="/test-page-two.html">Second page</a>
      </nav>
    </header>
    <main>
      <section>
        <h2>Search catalog</h2>
        <form action="/test-page.html" method="get">
          <label for="search">Search items</label>
          <input id="search" name="q" type="search">
          <button type="submit">Search</button>
        </form>
      </section>
      <section>
        <h2>Contact form</h2>
        <form action="/test-page.html" method="get">
          <label for="name">Name</label>
          <input id="name" name="name">
          <label for="email">Email</label>
          <input id="email" name="email" type="email">
          <button type="submit">Submit contact</button>
        </form>
      </section>
      <section>
        <h2>Product table</h2>
        <table>
          <thead><tr><th>Product</th><th>Category</th><th>Price</th></tr></thead>
          <tbody>
            <tr><td>Field Notes</td><td>Stationery</td><td>$8</td></tr>
            <tr><td>Travel Mug</td><td>Kitchen</td><td>$24</td></tr>
            <tr><td>Desk Lamp</td><td>Office</td><td>$39</td></tr>
          </tbody>
        </table>
      </section>
      <section style="margin-top: 80vh">
        <h2>Lower-page content</h2>
        <p>Scroll target: Evergreen trees are native to many temperate forests.</p>
      </section>
    </main>
  </body>
</html>
