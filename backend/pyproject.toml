[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clevis-backend"
version = "0.1.0"
description = "Async web-task orchestration API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "anyio>=4.8,<5",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sse-starlette>=2.2,<4",
  "httpx>=0.28,<1",
  "playwright==1.64.0",
  "openai>=2,<3",
  "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.browser" = ["*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: opt-in OpenRouter network and billing tests", "headed: launches a visible Chromium window when a display is available"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
exclude = ["^venv/", "^build/"]
